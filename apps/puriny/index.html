<!DOCTYPE html>
<html>
<head>
<script>
// Test-site cache control. Flutter web installs a service worker that stores
// the whole app on the phone and then serves ITS copy instead of asking the
// server — so the owner reloaded «Коллекция» again and again and kept being
// shown a build from days earlier, and reasonably concluded nothing had been
// rebuilt. It had been, and was live. Every "reload twice / private tab"
// instruction in this project was working around this without naming it.
//
// Two halves, and both are needed: refuse NEW registrations (patching the
// minified loader is fragile, so the API itself is neutered), and remove any
// worker ALREADY installed on this phone, which would otherwise keep serving
// its cache for ever.
(function () {
  if (!('serviceWorker' in navigator)) return;
  try {
    navigator.serviceWorker.register = function () {
      return Promise.resolve({ unregister: function () {
        return Promise.resolve(true); } });
    };
  } catch (e) { /* frozen in some browsers; the cleanup below still runs */ }

  navigator.serviceWorker.getRegistrations().then(function (regs) {
    var had = regs.length > 0;
    var jobs = regs.map(function (r) { return r.unregister(); });
    if (window.caches && caches.keys) {
      jobs.push(caches.keys().then(function (names) {
        return Promise.all(names.map(function (n) { return caches.delete(n); }));
      }));
    }
    Promise.all(jobs).then(function () {
      // Reload once, only if something was actually cleared, or this is a
      // refresh loop.
      if (had && !sessionStorage.getItem('sw-cleared')) {
        sessionStorage.setItem('sw-cleared', '1');
        location.reload();
      }
    });
  }).catch(function () {});
})();
</script>

  <!-- THE LABEL READER, IN THE BROWSER.
       `flutter_tesseract_ocr` supports web by CALLING A GLOBAL JS FUNCTION
       named `_extractText` that the app must provide — the plugin ships no
       web engine of its own. Without this block the photograph button throws
       «_extractText is not defined» on every web build, which is why the
       scanner was hidden in the browser and could be tested by nobody: the
       owner has no Android device, so an Android-only feature was one that
       neither of us could ever verify.
       Language data is fetched from tessdata_fast on first use (~2 MB for
       Russian) and cached by the browser, so the first scan in a session is
       slower than the rest. -->
  <script src="https://unpkg.com/tesseract.js@4.0.2/dist/tesseract.min.js"
          integrity="sha384-p0lyrUSwAXKW8+KUuu0G96F+bX2fnB1MGFTx5X/Y/99IjrwU1BnTzW+H71bs1Vrn"
          crossorigin="anonymous"></script>
  <script>
    async function _extractText(imagePath, mapData) {
      const worker = await Tesseract.createWorker({
        langPath: 'https://tessdata.projectnaptha.com/4.0.0_fast',
      });
      try {
        await worker.load();
        await worker.loadLanguage(mapData.language || 'rus');
        await worker.initialize(mapData.language || 'rus');
        if (mapData.args) await worker.setParameters(mapData.args);
        const out = await worker.recognize(imagePath);
        return mapData.args && mapData.args['tessjs_create_hocr']
          ? out.data.hocr : out.data.text;
      } finally {
        await worker.terminate();
      }
    }
  </script>
