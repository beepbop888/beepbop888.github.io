<!DOCTYPE html>
<html>
<head>
<script>
// Test-site cache control. Flutter web installs a service worker that stores
// the whole app on the phone and then serves ITS copy instead of asking the
// server — so the owner reloaded «Коллекция» again and again and kept being
// shown a build from days earlier, and reasonably concluded nothing had been
// rebuilt. It had been, and was live. Every "reload twice / private tab"
// instruction in this project was working around this without naming it.
//
// Two halves, and both are needed: refuse NEW registrations (patching the
// minified loader is fragile, so the API itself is neutered), and remove any
// worker ALREADY installed on this phone, which would otherwise keep serving
// its cache for ever.
(function () {
  if (!('serviceWorker' in navigator)) return;
  try {
    navigator.serviceWorker.register = function () {
      return Promise.resolve({ unregister: function () {
        return Promise.resolve(true); } });
    };
  } catch (e) { /* frozen in some browsers; the cleanup below still runs */ }

  navigator.serviceWorker.getRegistrations().then(function (regs) {
    var had = regs.length > 0;
    var jobs = regs.map(function (r) { return r.unregister(); });
    if (window.caches && caches.keys) {
      jobs.push(caches.keys().then(function (names) {
        return Promise.all(names.map(function (n) { return caches.delete(n); }));
      }));
    }
    Promise.all(jobs).then(function () {
      // Reload once, only if something was actually cleared, or this is a
      // refresh loop.
      if (had && !sessionStorage.getItem('sw-cleared')) {
        sessionStorage.setItem('sw-cleared', '1');
        location.reload();
      }
    });
  }).catch(function () {});
})();
</script>

<body>
  <!-- The barcode library, from OUR OWN origin.
       mobile_scanner injects this itself when the camera starts, but the
       photo-decoding fallback needs it whether the camera ever starts or
       not — and on a phone where the camera is refused, that fallback IS
       the app. 292 KB, loaded once. -->
  <script src="zxing.min.js"></script>
  <script>
    // Decode a QR or barcode out of a data: URL.
    //
    // WHY NOT `decodeFromImageElement`, which is the obvious call and was
    // what this used: it does not work. Given a clean 410x410 QR it answers
    // "No MultiFormat Readers were able to detect the code", and the old
    // helper turned that into '' — indistinguishable from "there was no code
    // in your photo". That is the whole reported fault: *"qr code reader is
    // not working"*.
    //
    // The canvas route decodes the same image first time. So: draw the
    // picture onto a canvas, take the luminance from that, and hand it to a
    // MultiFormatReader with TRY_HARDER. Tried upright first, then inverted,
    // because a light-on-dark code is common on screens and printed tickets.
    //
    // Returns JSON: {"text": "...", "problem": "..."}. The problem is
    // carried out rather than swallowed, because a decoder that fails
    // silently is exactly what shipped last time.
    window.decodeCodeFromDataUrl = function (dataUrl) {
      return new Promise(function (resolve) {
        var answer = function (text, problem) {
          resolve(JSON.stringify({text: text || '', problem: problem || ''}));
        };
        if (!window.ZXing) { answer('', 'Библиотека чтения не загрузилась.'); return; }
        var image = new Image();
        image.onerror = function () {
          answer('', 'Не удалось открыть это изображение.');
        };
        image.onload = function () {
          try {
            var w = image.naturalWidth || image.width;
            var h = image.naturalHeight || image.height;
            if (!w || !h) { answer('', 'Изображение пустое.'); return; }
            // A 12-megapixel phone photo is slow and no more readable; cap
            // the long side and let the binarizer work on something sane.
            var cap = 1600;
            var k = Math.min(1, cap / Math.max(w, h));
            var canvas = document.createElement('canvas');
            canvas.width = Math.round(w * k);
            canvas.height = Math.round(h * k);
            var ctx = canvas.getContext('2d', {willReadFrequently: true});
            ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

            var source = new ZXing.HTMLCanvasElementLuminanceSource(canvas);
            var hints = new Map();
            hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
            var last = '';
            for (var pass = 0; pass < 2; pass++) {
              try {
                var used = pass === 0 ? source : source.invert();
                var bitmap = new ZXing.BinaryBitmap(
                  new ZXing.HybridBinarizer(used));
                var reader = new ZXing.MultiFormatReader();
                reader.setHints(hints);
                var result = reader.decode(bitmap);
                var text = result.getText ? result.getText() : result.text;
                if (text) { answer(text, ''); return; }
              } catch (inner) {
                last = (inner && inner.message) || String(inner);
              }
            }
            answer('', 'Код на снимке не найден. Снимите ближе, чтобы код '
                     + 'занимал большую часть кадра.');
          } catch (outer) {
            answer('', 'Не удалось прочитать снимок: '
                     + ((outer && outer.message) || outer));
          }
        };
        image.src = dataUrl;
      });
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
